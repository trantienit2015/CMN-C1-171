[project]
name = "cmn-c1-171"
version = "0.1.0"
description = "Enterprise Agent Skill Routing & Task Classification Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; CI
# installs it from an internal package index. Pinning it here would make
# `pip install -e .` fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20240917",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# stubs/ declares the shape of the framework's AgentState so this template's State is
# checked as the TypedDict it is at runtime. See stubs/framework/schemas/agent_state.pyi.
mypy_path = "stubs"

# The framework and shared packages ship annotations but no py.typed marker, so mypy
# refuses to read them and every symbol they export becomes Any. That is upstream's to
# fix; until it is, the two consequences are declared here rather than left to fail the
# run. The scope is exactly those distributions — nothing this template owns is exempted.
[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

# Base classes reaching us as Any is the same gap seen from the other side: every node
# and graph in this template subclasses one of them.
[[tool.mypy.overrides]]
module = ["src.*"]
disallow_subclassing_any = false
